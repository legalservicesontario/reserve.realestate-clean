<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Property Details — Reserve.RealEstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            harbor: {
              50: '#f4f6f8', 100: '#e5e9ee', 200: '#cbd4e0', 300: '#a2b2c8',
              400: '#738ba9', 500: '#516d8e', 600: '#3e5473', 700: '#33445e',
              800: '#2d3a4e', 900: '#293243', 950: '#0f141c',
            },
            tide: {
              50: '#f0fdfa', 300: '#5eead4', 400: '#2dd4bf', 700: '#0f766e', 800: '#115e59',
            },
            coral: { 300: '#fca5a5', 700: '#b91c1c' },
            sand: { 50: '#fbfaf8' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans bg-sand-50 text-harbor-900">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-harbor-100">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 flex items-center justify-between h-16 gap-4">
      <a class="flex items-center gap-2 shrink-0 font-extrabold text-xl tracking-wider text-harbor-950 uppercase focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600 rounded" href="index.html">
        RESERVE<span class="text-tide-700">.REAL ESTATE</span>
      </a>
      <nav aria-label="Main navigation" class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="index.html">Home</a>
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="map.html">Map</a>
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="commercial.html">Commercial</a>
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="agents.html">Agents</a>
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="post-property.html">List Your Property</a>
        <a class="px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" href="dashboard.html">Dashboard</a>
      </nav>
      <div class="flex items-center gap-2">
        <a class="hidden sm:inline-flex px-4 py-2 text-sm font-semibold text-white bg-tide-700 hover:bg-tide-800 rounded-lg shadow-sm transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tide-800" href="post-property.html">Contact Agent</a>
        <button id="mobile-menu-btn" type="button" class="md:hidden inline-flex items-center justify-center h-10 w-10 rounded-lg border border-harbor-200 text-harbor-800 hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </div>
    <nav id="mobile-menu" aria-label="Mobile navigation" class="hidden md:hidden border-t border-harbor-100 bg-white px-4 pb-4 pt-2 space-y-1 text-sm font-medium">
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="index.html">Home</a>
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="map.html">Map</a>
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="commercial.html">Commercial</a>
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="agents.html">Agents</a>
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="post-property.html">List Your Property</a>
      <a class="block px-3 py-2 rounded-lg text-harbor-800 hover:bg-harbor-50" href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main id="property-container" class="flex-1 mx-auto max-w-7xl w-full px-4 sm:px-6 py-10">
    <div id="property-content">
      <p class="text-harbor-500">Loading property…</p>
    </div>
  </main>

  <a href="https://wa.me/16478485997?text=Hi%20Reserve.RealEstate%2C%20I%27d%20like%20more%20information" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 z-30 flex items-center gap-2 bg-tide-700 hover:bg-tide-800 text-white pl-4 pr-5 py-3 rounded-full shadow-xl transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tide-900">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.06-1.32A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Zm0 18c-1.6 0-3.1-.44-4.38-1.2l-.31-.18-3.01.79.8-2.94-.2-.31A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8Z"></path></svg>
    <span class="font-semibold text-sm">WhatsApp</span>
  </a>

  <footer class="bg-harbor-950 text-white py-8 border-t border-harbor-900">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-harbor-400">
      <p>© 2026 RESERVE.REAL ESTATE — Dominican Republic & Costa Rica Luxury Real Estate.</p>
      <div class="flex gap-4">
        <a class="hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-400 rounded" href="index.html">Home</a>
        <a class="hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-400 rounded" href="map.html">Map</a>
        <a class="hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-400 rounded" href="agents.html">Agents</a>
        <a class="hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-400 rounded" href="post-property.html">List Property</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('mobile-menu-btn');
      var menu = document.getElementById('mobile-menu');
      if (btn && menu) {
        btn.addEventListener('click', function () {
          var expanded = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!expanded));
          menu.classList.toggle('hidden');
        });
      }
    })();

    function qParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function notFoundMarkup(message) {
      return `
        <div class="text-center py-20">
          <p class="text-2xl font-bold text-harbor-900">${message}</p>
          <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
            <a href="map.html" class="inline-block bg-tide-700 hover:bg-tide-800 text-white px-6 py-3 rounded-lg font-semibold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tide-900">Browse the Map</a>
            <a href="index.html" class="inline-block bg-white border border-harbor-200 text-harbor-800 px-6 py-3 rounded-lg font-semibold hover:bg-harbor-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600">Return Home</a>
          </div>
        </div>
      `;
    }

    async function render() {
      const container = document.getElementById('property-content');
      const id = qParam('id');

      try {
        const res = await fetch('data/properties.json');
        if (!res.ok) throw new Error('Failed to fetch properties: ' + res.status);
        const data = await res.json();
        const listings = data.listings || [];

        if (!id) {
          container.innerHTML = notFoundMarkup('Select a property from the map or homepage to see its details.');
          return;
        }

        const property = listings.find(x => x.id === id);

        if (!property) {
          container.innerHTML = notFoundMarkup('We couldn\u2019t find that property. It may have been removed or the link is incorrect.');
          return;
        }

        const imageHtml = property.images && property.images.length > 1
          ? `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
              ${property.images.map((img, i) => `<img src="${img}" alt="${property.title} - Image ${i + 1}" class="rounded-xl object-cover w-full h-56">`).join('')}
            </div>`
          : `<img src="${(property.images && property.images[0]) || ''}" alt="${property.title}" class="w-full rounded-xl object-cover max-h-96 mb-8">`;

        container.innerHTML = `
          <div class="mb-6">
            <a href="map.html" class="text-tide-700 hover:text-tide-800 font-semibold focus-visible:outline focus-visible:outline-2 focus-visible:outline-tide-600 rounded">&larr; Back to Properties</a>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-harbor-100 p-6 sm:p-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-harbor-950 mb-2">${property.title}</h1>
            <div class="flex items-center gap-3 mb-6 flex-wrap text-sm">
              <p class="text-tide-700 uppercase font-semibold tracking-wider">${property.location}</p>
              <span class="text-harbor-300">•</span>
              <p class="text-harbor-600 capitalize">${property.type}</p>
              <span class="text-harbor-300">•</span>
              <p class="text-harbor-800 font-semibold">${property.saleOrRent === 'rent' ? 'For Rent' : 'For Sale'}</p>
            </div>

            <div class="text-3xl font-bold text-harbor-950 mb-1">$${Number(property.price).toLocaleString()}</div>
            ${property.saleOrRent === 'rent' ? '<p class="text-sm text-harbor-500 mb-8">per month</p>' : '<p class="text-sm text-harbor-500 mb-8">purchase price</p>'}

            ${imageHtml}

            <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div class="rounded-xl bg-harbor-50 p-4">
                <p class="text-tide-700 uppercase text-xs font-semibold mb-1">Bedrooms</p>
                <p class="text-2xl font-bold text-harbor-900">${property.beds ?? '—'}</p>
              </div>
              <div class="rounded-xl bg-harbor-50 p-4">
                <p class="text-tide-700 uppercase text-xs font-semibold mb-1">Bathrooms</p>
                <p class="text-2xl font-bold text-harbor-900">${property.baths ?? '—'}</p>
              </div>
              <div class="rounded-xl bg-harbor-50 p-4">
                <p class="text-tide-700 uppercase text-xs font-semibold mb-1">Area</p>
                <p class="text-2xl font-bold text-harbor-900">${property.area_m2 ?? '—'}<span class="text-base">m²</span></p>
              </div>
              <div class="rounded-xl bg-harbor-50 p-4">
                <p class="text-tide-700 uppercase text-xs font-semibold mb-1">Type</p>
                <p class="text-xl font-bold text-harbor-900 capitalize">${property.type}</p>
              </div>
            </div>

            <div class="max-w-none mb-8">
              <h2 class="text-xl font-bold text-harbor-900 mb-3">About This Property</h2>
              <p class="text-harbor-700 leading-relaxed">${property.description || 'Contact us for full details about this luxury listing.'}</p>
            </div>

            <div class="grid sm:grid-cols-2 gap-4">
              <a href="https://wa.me/16478485997?text=${encodeURIComponent('I am interested in ' + property.title)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-green-600 hover:bg-green-700 text-white text-center py-4 rounded-xl uppercase tracking-wide font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-800">
                Contact via WhatsApp
              </a>
              <a href="post-property.html" class="inline-flex items-center justify-center w-full bg-tide-700 hover:bg-tide-800 text-white text-center py-4 rounded-xl uppercase tracking-wide font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tide-900">
                Request More Info
              </a>
            </div>
          </div>
        `;
      } catch (err) {
        console.error('Error loading property:', err);
        container.innerHTML = notFoundMarkup('We\u2019re having trouble loading property details right now. Please try again shortly.');
      }
    }

    render();
  </script>
</body>
</html>
