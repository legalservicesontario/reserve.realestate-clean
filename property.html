<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — Reserve.RealEstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#c8a96a;--cream:#f8f6f0;}
    body{margin:0;background:var(--cream);color:#111;font-family:'Inter',sans-serif;}
    h1,h2,h3{font-family:'Cormorant Garamond',serif;}
    .gold{color:var(--gold);}    
    .card{background:white;border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.08);}    
    .gallery img{height:300px;width:100%;object-fit:cover;border-radius:20px;transition:.5s;}
    .gallery img:hover{transform:scale(1.05);}    
    .gold-line{width:80px;height:3px;background:var(--gold);}  
  </style>
</head>
<body>
  <nav class="bg-white border-b sticky top-0 z-40 flex justify-between items-center px-8 py-4 shadow-md">
    <a href="index.html" class="text-2xl font-bold">RESERVE<span class="gold">REALESTATE</span></a>
    <div class="hidden md:flex gap-6">
      <a href="index.html" class="hover:text-[#c8a96a]">Home</a>
      <a href="map.html" class="hover:text-[#c8a96a]">Map</a>
      <a href="commercial.html" class="hover:text-[#c8a96a]">Commercial</a>
      <a href="agents.html" class="hover:text-[#c8a96a]">Agents</a>
      <a href="post-property.html" class="hover:text-[#c8a96a]">List Property</a>
    </div>
  </nav>

  <main id="property-container" class="max-w-7xl mx-auto px-8 py-12">
    <div id="property-content"></div>
  </main>

  <a href="https://wa.me/16478485997" target="_blank" rel="noopener noreferrer" class="fixed bottom-8 right-8 bg-green-600 hover:bg-green-700 text-white px-6 py-4 rounded-full shadow-xl transition-all duration-300">
    <div class="font-semibold">WhatsApp</div>
    <div class="text-sm">+1 (647) 848-5997</div>
  </a>

  <footer class="bg-black text-gray-400 text-center py-12 mt-16">
    <div class="text-white text-2xl tracking-[8px] mb-5">RESERVE.REALESTATE</div>
    <p>Luxury Real Estate Collection</p>
    <p class="mt-5">© 2026 Reserve.RealEstate All Rights Reserved.</p>
  </footer>

  <script src="js/property-map.js"></script>
  <script>
    function qParam(name){ const url = new URL(window.location.href); return url.searchParams.get(name); }
    
    async function render(){
      try{
        const id = qParam('id');
        const res = await fetch('data/properties.json');
        const data = await res.json();
        const alias = (typeof PROPERTY_ID_ALIASES !== 'undefined' && id) ? PROPERTY_ID_ALIASES[id] : null;
        const property = (data.listings || []).find(x => x.id === id || (alias && x.id === alias)) || data.listings[0];
        const container = document.getElementById('property-content');
        
        if(!property){
          container.innerHTML = '<div class="text-center py-20"><p class="text-2xl">Property not found.</p><a href="index.html" class="inline-block mt-4 bg-[#c8a96a] text-black px-6 py-3 rounded-lg">Return Home</a></div>';
          return;
        }

        const imageHtml = property.images && property.images.length > 1
          ? `<div class="gallery grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
              ${property.images.map((img, i) => `<img src="${img}" alt="${property.title} - Image ${i+1}" class="rounded-xl">`).join('')}
            </div>`
          : `<img src="${(property.images && property.images[0]) || ''}" alt="${property.title}" class="w-full rounded-2xl object-cover max-h-96 mb-12">`;

        container.innerHTML = `
          <div class="mb-8">
            <a href="map.html" class="text-[#c8a96a] hover:underline">&larr; Back to Properties</a>
          </div>

          <div class="card p-8 mb-8">
            <h1 class="text-5xl mb-2">${property.title}</h1>
            <div class="flex items-center gap-4 mb-6 flex-wrap">
              <p class="gold uppercase text-sm font-semibold tracking-wider">${property.location}</p>
              <p class="text-gray-600">•</p>
              <p class="text-gray-600">${property.type}</p>
              <p class="text-gray-600">•</p>
              <p class="font-semibold">${property.saleOrRent=='rent'?'For Rent':'For Sale'}</p>
            </div>
            <div class="gold-line mb-6"></div>
            
            <div class="text-4xl font-bold gold mb-8">$${property.price.toLocaleString()}</div>
            ${property.saleOrRent=='rent'?'<p class="text-lg text-gray-600 mb-8">per month</p>':''}
            
            ${imageHtml}
            
            <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
              <div class="card p-6 bg-gray-50">
                <p class="gold uppercase text-xs font-semibold mb-2">Bedrooms</p>
                <p class="text-3xl font-bold">${property.beds}</p>
              </div>
              <div class="card p-6 bg-gray-50">
                <p class="gold uppercase text-xs font-semibold mb-2">Bathrooms</p>
                <p class="text-3xl font-bold">${property.baths}</p>
              </div>
              <div class="card p-6 bg-gray-50">
                <p class="gold uppercase text-xs font-semibold mb-2">Area</p>
                <p class="text-3xl font-bold">${property.area_m2}<span class="text-lg">m²</span></p>
              </div>
              <div class="card p-6 bg-gray-50">
                <p class="gold uppercase text-xs font-semibold mb-2">Type</p>
                <p class="text-2xl font-bold">${property.type}</p>
              </div>
            </div>
            
            <div class="prose max-w-none mb-8">
              <h2 class="text-3xl mb-4">About This Property</h2>
              <p class="text-lg text-gray-700 leading-relaxed">${property.description || 'Contact us for full details about this luxury listing.'}</p>
            </div>
            
            <div class="grid md:grid-cols-2 gap-6 mb-8">
              <a href="https://wa.me/16478485997?text=I%20am%20interested%20in%20${encodeURIComponent(property.title)}" class="inline-block w-full bg-green-600 hover:bg-green-700 text-white text-center py-4 rounded-xl uppercase tracking-wider font-semibold transition">
                Contact via WhatsApp
              </a>
              <a href="post-property.html" class="inline-block w-full bg-[#c8a96a] hover:bg-[#b39657] text-black text-center py-4 rounded-xl uppercase tracking-wider font-semibold transition">
                Request More Info
              </a>
            </div>
          </div>
        `;
      }catch(err){
        console.error('Error:', err);
        document.getElementById('property-content').innerHTML = '<p class="text-center text-red-600">Error loading property details.</p>';
      }
    }
    
    render();
  </script>
</body>
</html>
