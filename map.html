<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Map — Reserve.RealEstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#c8a96a;--cream:#f8f6f0;}
    body{margin:0;background:var(--cream);color:#111;font-family:'Inter',sans-serif;}
    h1,h2{font-family:'Cormorant Garamond',serif;}
    #map{height:calc(100vh - 240px);min-height:420px;}
    .gold{color:var(--gold);}  
  </style>
</head>
<body>
  <nav class="bg-white border-b sticky top-0 z-40 flex justify-between items-center px-8 py-4 shadow-md">
    <a href="index.html" class="text-2xl font-bold">RESERVE<span class="gold">REALESTATE</span></a>
    <div class="hidden md:flex gap-6">
      <a href="index.html" class="hover:text-[#c8a96a]">Home</a>
      <a href="map.html" class="gold font-semibold">Map</a>
      <a href="commercial.html" class="hover:text-[#c8a96a]">Commercial</a>
      <a href="agents.html" class="hover:text-[#c8a96a]">Agents</a>
      <a href="post-property.html" class="hover:text-[#c8a96a]">List Property</a>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-8 py-6">
    <h1 class="text-4xl mb-2">Interactive Property Map</h1>
    <p class="text-gray-600 mb-4">Explore listings across our Caribbean destinations. Click markers for details and property links.</p>
  </div>

  <div id="map" class="rounded-lg overflow-hidden mx-8" role="application" aria-label="Property locations map"></div>

  <footer class="bg-black text-gray-400 text-center py-8 mt-8">
    <div class="text-white text-xl tracking-[4px] mb-3">RESERVE.REALESTATE</div>
    <p>© 2026 Reserve.RealEstate All Rights Reserved.</p>
  </footer>

  <script>
    function showMapMessage(message) {
      document.getElementById('map').innerHTML =
        `<div class="h-full min-h-[420px] flex items-center justify-center bg-gray-100 px-6 text-center text-gray-600">${message}</div>`;
    }

    async function initMap() {
      try {
        const response = await fetch('data/properties.json');
        if (!response.ok) throw new Error(`Property data request failed: ${response.status}`);
        const data = await response.json();
        const listings = (data.listings || []).filter(property => Number.isFinite(Number(property.lat)) && Number.isFinite(Number(property.lng)));
        const map = new google.maps.Map(document.getElementById('map'), {
          center: { lat: 18.6, lng: -69.9 },
          zoom: 8,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: true
        });
        const bounds = new google.maps.LatLngBounds();
        const infoWindow = new google.maps.InfoWindow();

        listings.forEach(property => {
          const position = { lat: Number(property.lat), lng: Number(property.lng) };
          const marker = new google.maps.Marker({
            map,
            position,
            title: property.title,
            label: { text: '◆', color: '#c8a96a', fontSize: '24px' }
          });
          bounds.extend(position);
          marker.addListener('click', () => {
            const price = Number(property.price).toLocaleString();
            const suffix = property.saleOrRent === 'rent' ? ' / month' : '';
            infoWindow.setContent(`
              <div style="padding:8px;max-width:240px">
                <strong>${property.title}</strong><br>
                ${property.location}<br>
                $${price}${suffix}<br>
                <a href="property.html?id=${encodeURIComponent(property.id)}">View details</a>
              </div>
            `);
            infoWindow.open({ map, anchor: marker });
          });
        });
        if (listings.length) map.fitBounds(bounds);
      } catch (error) {
        console.error('Map error:', error);
        showMapMessage('Property locations are temporarily unavailable. Please try again later.');
      }
    }

    function loadGoogleMaps() {
      const apiKey = window.GOOGLE_MAPS_API_KEY;
      if (!apiKey) {
        showMapMessage('Google Maps is not configured. Set <code>window.GOOGLE_MAPS_API_KEY</code> before loading this page.');
        return;
      }
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&callback=initMap`;
      script.async = true;
      script.defer = true;
      script.onerror = () => showMapMessage('Google Maps could not be loaded. Check the API key and allowed domains.');
      document.head.appendChild(script);
    }

    window.initMap = initMap;
    loadGoogleMaps();
  </script>
</body>
</html>
