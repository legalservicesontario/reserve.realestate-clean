<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Map — Reserve.RealEstate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="assets/css/whatsapp-float.css" />
  <style>
    :root{--gold:#c8a96a;--cream:#f8f6f0;}
    body{margin:0;background:var(--cream);color:#111;font-family:'Inter',sans-serif;}
    h1,h2{font-family:'Cormorant Garamond',serif;}
    #map{height:calc(100vh - 240px);}    
    .gold{color:var(--gold);}
    /* Lift the shared WhatsApp button clear of the Leaflet bottom controls
       (zoom + attribution) so the two never overlap on the map page. */
    .whatsapp-float{bottom:5rem;}
    @media (max-width:640px){.whatsapp-float{bottom:4.5rem;}}
  </style>
</head>
<body>
  <nav class="bg-white border-b sticky top-0 z-40 flex justify-between items-center px-8 py-4 shadow-md">
    <a href="index.html" class="text-2xl font-bold">RESERVE<span class="gold">REALESTATE</span></a>
    <div class="hidden md:flex gap-6">
      <a href="index.html" class="hover:text-[#c8a96a]">Home</a>
      <a href="map.html" class="gold font-semibold">Map</a>
      <a href="commercial.html" class="hover:text-[#c8a96a]">Commercial</a>
      <a href="agents.html" class="hover:text-[#c8a96a]">Agents</a>
      <a href="post-property.html" class="hover:text-[#c8a96a]">List Property</a>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-8 py-6">
    <h1 class="text-4xl mb-2">Interactive Property Map</h1>
    <p class="text-gray-600 mb-4">Explore listings across our Caribbean destinations. Click markers for details and property links.</p>
  </div>

  <div id="map" class="rounded-lg overflow-hidden mx-8"></div>

  <footer class="bg-black text-gray-400 text-center py-8 mt-8">
    <div class="text-white text-xl tracking-[4px] mb-3">RESERVE.REALESTATE</div>
    <p>© 2026 Reserve.RealEstate All Rights Reserved.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    async function loadMap(){
      try{
        const res = await fetch('data/properties.json');
        const data = await res.json();
        const map = L.map('map').setView([18.6, -69.9], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

        data.listings.forEach(p => {
          if(p.lat && p.lng){
            const marker = L.circleMarker([p.lat,p.lng],{radius:8,fillColor:'#c8a96a',color:'#fff',weight:2,opacity:1,fillOpacity:0.8}).addTo(map);
            marker.bindPopup(`<div class="p-3"><strong>${p.title}</strong><br>${p.location}<br>$${p.price.toLocaleString()} ${p.saleOrRent=='rent'?'/mo':''}<br><a href="property.html?id=${p.id}" class="text-blue-600 underline">View details</a></div>`);
          }
        });
      }catch(err){
        console.error('Map error:', err);
      }
    }
    loadMap();
  </script>

  <a href="https://wa.me/16478485997?text=Hi%20Reserve" target="_blank" rel="noopener noreferrer" class="whatsapp-float" aria-label="Chat with Reserve.RealEstate on WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.65-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.346.446-.52.151-.177.201-.297.302-.495.1-.197.05-.371-.025-.52-.075-.15-.67-1.612-.918-2.204-.242-.57-.487-.493-.67-.503l-.57-.01c-.197 0-.52.075-.792.371s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.077c.15.197 2.095 3.2 5.076 4.487 1.413.61 2.514.974 3.381 1.247 1.42.452 2.717.388 3.743.235.114-.033.36-.146.412-.289.05-.14.05-.52.035-.72-.015-.197-.18-.297-.397-.444z"/></svg>
  </a>
</body>
</html>
